# dns-switch の設定。
# このファイルがリポジトリ側の正。./install.sh --only 80 で
# /usr/local/etc/dns-switch.conf に root 所有でコピーされる。

# 自宅とみなす Wi-Fi の SSID。どれかに一致したら下の DNS を使う。
#
# 同じ LAN に複数の AP やバンド (2.4GHz / 5GHz で別名) がある場合は並べて書く。
# 1つしか書いていないと、同じ自宅LANの別APにつないだときに
# 「自宅ではない」と判定されて DNS が切り替わらない。
# つないでいる SSID は `sudo dns-switch --status` で確認できる。
HOME_SSIDS=(
  "NSD1K-9118-a"
  "<redacted>"
)

# 自宅で使う DNS サーバ (スペース区切り、優先順)。
HOME_DNS="192.168.100.53 192.168.100.54"
