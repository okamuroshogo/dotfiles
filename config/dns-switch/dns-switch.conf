# dns-switch の設定。
# このファイルがリポジトリ側の正。./install.sh --only 80 で
# /usr/local/etc/dns-switch.conf に root 所有でコピーされる。

# 自宅のルータ (デフォルトゲートウェイ) の MAC アドレス。これが自宅判定の本体。
# ゲートウェイの MAC がどれかに一致しなければ、SSID が何であっても自宅とはみなさない。
# 外の Wi-Fi やテザリングはここで弾かれる。
# 確認: arp -n $(ipconfig getoption en0 router)   または `sudo dns-switch --status`
HOME_ROUTER_MACS=(
  "f8:aa:3f:35:91:18"   # 192.168.1.1 (NSD1K-9118)
)

# 自宅の Wi-Fi の SSID (追加の条件)。
# SSID が読めたときだけ使い、一致しなければ自宅ではないと判定する。
# macOS 15 以降は位置情報の許可が無いと SSID が "<redacted>" と伏せられるので、
# その場合は無視される。"<redacted>" をここに書いてはいけない (全 Wi-Fi が一致してしまう)。
HOME_SSIDS=(
  "NSD1K-9118-a"
)

# 自宅で使う DNS サーバ (スペース区切り、優先順)。
# どれかが実際に応答したときだけ切り替える (落ちていたら DHCP のまま)。
HOME_DNS="192.168.100.53 192.168.100.54"
